name: Publish UI Kit to npm

# Requires one-time setup before this workflow can publish:
#
#   1. Create an NPM_TOKEN secret in this repo (Settings → Secrets → Actions):
#      Generate a Publish token at npmjs.com → Access Tokens → Generate New Token
#      with write access to the @aindy scope.
#
#   2. Create a GitHub Environment (Settings → Environments):
#      npm-production — add yourself as a required reviewer (manual approval gate)

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  validate-version:
    name: Validate Tag Matches package.json Version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Assert tag matches package.json version
        id: check
        run: |
          TAG="${{ github.ref_name }}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          EXPECTED="${TAG#v}"
          if [ "$PKG_VERSION" != "$EXPECTED" ]; then
            echo "Tag $TAG does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "Version OK: $PKG_VERSION"

  lint-and-test:
    name: Lint, Type Check & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Tests
        run: npm run test

  build:
    name: Build and Pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [validate-version, lint-and-test]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Verify dist artifacts
        run: |
          test -f dist/index.js
          test -f dist/index.cjs
          test -f dist/index.d.ts
          echo "UI Kit build OK — $(du -sh dist | cut -f1) total"

      - name: Create release tarball
        run: |
          TARBALL=$(npm pack --silent)
          echo "tarball=$TARBALL" >> "$GITHUB_ENV"

      - name: Verify tarball contains only dist/ and package metadata
        run: |
          tar tzf "$tarball" | sort | tee pack-contents.txt
          NON_DIST=$(grep -vE "^package/(dist/|package\.json|README)" pack-contents.txt || true)
          if [ -n "$NON_DIST" ]; then
            echo "ERROR: unexpected files in tarball (outside dist/):"
            echo "$NON_DIST"
            exit 1
          fi
          echo "Pack check OK"

      - name: Upload release tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-kit-tarball
          path: "*.tgz"

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    environment: npm-production
    permissions:
      contents: read
      id-token: write   # for npm publish --provenance

    steps:
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Download release tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ui-kit-tarball

      - name: Publish to npm
        run: npm publish *.tgz --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [publish-npm]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download release tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ui-kit-tarball

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" *.tgz \
            --title "@aindy/ui-kit ${{ github.ref_name }}" \
            --generate-notes
